<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}}@keyframes float{0%{transform:translateY(0)}}.badge,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:44px;fill:url(#text-grad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge{font-weight:600;font-size:14px;fill:#e2e8f0}.pulse-circle{animation:pulse 3s infinite alternate ease-in-out}.float-icon{animation:float 4s infinite alternate ease-in-out}</style></defs><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g opacity=".15"><path stroke="#94a3b8" stroke-width="1" d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200"/><path stroke="#94a3b8" stroke-width="1" d="M200 0V300M400 0V300M600 0V300M800 0V300M1000 0V300"/></g><circle cx="1050" cy="80" r="180" fill="url(#glow-grad)" class="pulse-circle"/><circle cx="150" cy="220" r="120" fill="url(#glow-grad)" class="pulse-circle"/><g><g class="float-icon" transform="translate(80, 75) translate(0, 5)"><rect width="70" height="70" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="16"/><path