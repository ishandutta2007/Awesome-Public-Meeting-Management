<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      .pulse-circle { animation: pulse 3s infinite alternate ease-in-out; }
      .float-icon { animation: float 4s infinite alternate ease-in-out; }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Decorative Grid & Floating Geometric Shapes -->
  <g opacity="0.15">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M200 0V300M400 0V300M600 0V300M800 0V300M1000 0V300" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="1050" cy="80" r="180" fill="url(#glow-grad)" class="pulse-circle"/>
  <circle cx="150" cy="220" r="120" fill="url(#glow-grad)" class="pulse-circle"/>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 75)">
    <!-- Icon / Badge graphics -->
    <g transform="translate(0, 5)" class="float-icon">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <!-- Gavel / Governance SVG Icon -->
      <path d="M22 46L46 22M28 18L52 42M16 28L28 16L40 28L28 40L16 28ZM44 44L56 56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="95" y="42" class="title" filter="url(#glow)">Awesome Public Meeting Management</text>
    <text x="95" y="80" class="subtitle">Curated SaaS Platforms, Open-Source Tools &amp; Governance Ecosystem</text>

    <!-- Feature Tags -->
    <g transform="translate(95, 115)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#334155"/>
      <text x="18" y="21" class="badge">🏛️ Civic Tech</text>

      <rect x="175" y="0" width="180" height="32" rx="16" fill="#334155"/>
      <text x="193" y="21" class="badge">📋 Agenda &amp; Minutes</text>

      <rect x="370" y="0" width="190" height="32" rx="16" fill="#334155"/>
      <text x="388" y="21" class="badge">🔓 Public Transparency</text>

      <rect x="575" y="0" width="150" height="32" rx="16" fill="#334155"/>
      <text x="593" y="21" class="badge">⭐ Open Source</text>
    </g>
  </g>
</svg>
